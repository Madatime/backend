server.port=8080
spring.application.name=aliviababa

#Conexion a la base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aliviababa_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

##Configuracion global de cors para react
spring.mvc.cors.allowed-origins= http://localhost:5173
spring.mvc.cors.allowed-methods= GET, POST, PUT, DELETE, OPTIONS

# PROPIEDADES DE SEGURIDAD / JWT (CLAVE DE 256 BITS EN HEXADECIMAL)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

#API KEY DE STRIPE
stripe.apikey.secret=${STRIPE_SECRET_KEY}
